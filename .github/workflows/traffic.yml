# Records repo traffic daily (GitHub itself only shows the last 14 days). Requires a repository secret
# TRAFFIC_TOKEN: a fine-grained personal access token for this repo with "Administration: Read-only".
# Without the secret the job just skips.
name: traffic stats
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: record
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "$TRAFFIC_TOKEN" ]; then echo "TRAFFIC_TOKEN secret not set; skipping"; exit 0; fi
          python3 scripts/record_traffic.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats && git diff --cached --quiet || git commit -m "stats: $(date -u +%F)" && git push
